<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Свои — объявления Луганска</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="pre-react-fallback" style="display:none;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,system-ui,sans-serif;background:#f7f5f1;color:#1c2b33;">
        <h1 style="font-size:18px;margin-bottom:8px;">Не удалось запустить приложение</h1>
        <p style="font-size:14px;color:#6b7680;max-width:320px;">Произошла ошибка ещё до отрисовки интерфейса. Откройте это же место через chrome://inspect, чтобы увидеть подробности в консоли.</p>
        <code id="pre-react-fallback-msg" style="font-size:11px;color:#9aa3ac;margin-top:16px;max-width:100%;overflow:auto;white-space:pre-wrap;"></code>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        // Срабатывает только если React ещё ничего не успел отрисовать в #root.
        if (root && root.children.length <= 1) {
          var fallback = document.getElementById("pre-react-fallback");
          var msg = document.getElementById("pre-react-fallback-msg");
          if (fallback) fallback.style.display = "flex";
          if (msg) msg.textContent = (e.error && e.error.message) || e.message || "неизвестная ошибка";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
